<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Support Lines | Eid Card</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@700;800&family=Poppins:wght@600;700&display=swap" rel="stylesheet">

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 24px;
      background: #eef2f6;
      font-family: "Cairo", Arial, sans-serif;
      color: #0b3550;
    }

    .app {
      width: 100%;
      max-width: 620px;
      background: white;
      padding: 30px;
      border-radius: 24px;
      box-shadow: 0 18px 50px rgba(11, 53, 80, 0.12);
      text-align: center;
    }

    .badge {
      display: inline-block;
      background: rgba(244, 91, 31, 0.1);
      color: #f45b1f;
      padding: 8px 16px;
      border-radius: 999px;
      font-weight: 800;
      margin-bottom: 14px;
    }

    h1 {
      margin: 0 0 10px;
      font-size: 28px;
    }

    p {
      margin: 0 0 24px;
      color: #617283;
      line-height: 1.8;
    }

    .field {
      text-align: start;
      margin-bottom: 16px;
    }

    label {
      display: block;
      margin-bottom: 8px;
      font-weight: 800;
    }

    select, input, button {
      width: 100%;
      min-height: 56px;
      border-radius: 16px;
      font-size: 16px;
      font-family: inherit;
    }

    select, input {
      border: 1px solid #d7e0e8;
      padding: 0 16px;
      outline: none;
    }

    button {
      border: 0;
      background: #f45b1f;
      color: white;
      font-weight: 800;
      cursor: pointer;
    }

    button:hover {
      background: #e14f16;
    }

    button:disabled {
      opacity: 0.7;
      cursor: wait;
    }

    canvas { display: none; }
  </style>
</head>

<body>
  <div class="app">
    <div class="badge">Support Lines</div>
    <h1 id="title">صمّم بطاقة تهنئة العيد الخاصة بك</h1>
    <p id="subtitle">اختَر اللغة، اكتب اسمك، ثم حمّل بطاقة العيد باسمك.</p>

    <div class="field">
      <label for="lang">اللغة / Language</label>
      <select id="lang">
        <option value="ar">العربية</option>
        <option value="en">English</option>
      </select>
    </div>

    <div class="field">
      <label for="name">الاسم / Name</label>
      <input id="name" type="text" maxlength="40" placeholder="اكتب الاسم هنا / Enter your name here">
    </div>

    <button id="downloadBtn">تحميل البطاقة</button>
    <canvas id="cardCanvas"></canvas>
  </div>

  <script>
    const images = {
      ar: "EidAladha-AR.png",
      en: "EidAladha-EN.png"
    };

    const settings = {
      ar: {
        title: "صمّم بطاقة تهنئة العيد الخاصة بك",
        subtitle: "اختَر اللغة، اكتب اسمك، ثم حمّل بطاقة العيد باسمك.",
        button: "تحميل البطاقة",
        alert: "فضلاً اكتب الاسم أولاً",
        fileLang: "Arabic",
        font: '"Cairo", Tahoma, Arial, sans-serif',
        weight: 800,
        startSize: 48,
        minSize: 24,
        color: "#0b4563",

        // مكان الشكل البيضاوي الأبيض
        boxX: 0.295,
        boxY: 0.785,
        boxW: 0.430,
        boxH: 0.075
      },
      en: {
        title: "Create Your Eid Greeting Card",
        subtitle: "Choose the language, enter your name, then download your Eid card.",
        button: "Download Card",
        alert: "Please enter your name first",
        fileLang: "English",
        font: '"Poppins", Arial, sans-serif',
        weight: 700,
        startSize: 44,
        minSize: 22,
        color: "#0b4563",

        // مكان الشكل البيضاوي الأبيض
        boxX: 0.295,
        boxY: 0.785,
        boxW: 0.430,
        boxH: 0.075
      }
    };

    const canvas = document.getElementById("cardCanvas");
    const ctx = canvas.getContext("2d");
    const langSelect = document.getElementById("lang");
    const nameInput = document.getElementById("name");
    const downloadBtn = document.getElementById("downloadBtn");
    const title = document.getElementById("title");
    const subtitle = document.getElementById("subtitle");

    function updateUI() {
      const lang = langSelect.value;
      const s = settings[lang];

      document.documentElement.lang = lang;
      document.documentElement.dir = lang === "ar" ? "rtl" : "ltr";

      title.textContent = s.title;
      subtitle.textContent = s.subtitle;
      downloadBtn.textContent = s.button;
    }

    function loadImage(src) {
      return new Promise((resolve, reject) => {
        const img = new Image();
        img.onload = () => resolve(img);
        img.onerror = reject;
        img.src = src;
      });
    }

    function fitFontSize(text, s, maxWidth) {
      let size = s.startSize;

      while (size >= s.minSize) {
        ctx.font = `${s.weight} ${size}px ${s.font}`;
        if (ctx.measureText(text).width <= maxWidth) return size;
        size--;
      }

      return s.minSize;
    }

    function sanitizeFileName(name) {
      return name
        .replace(/[^a-zA-Z0-9\u0600-\u06FF _-]/g, "")
        .trim()
        .replace(/\s+/g, "_") || "employee";
    }

    async function renderAndDownload() {
      const lang = langSelect.value;
      const s = settings[lang];
      const name = nameInput.value.trim();

      if (!name) {
        alert(s.alert);
        nameInput.focus();
        return;
      }

      downloadBtn.disabled = true;
      downloadBtn.textContent = lang === "ar" ? "جاري تجهيز البطاقة..." : "Preparing card...";

      try {
        await document.fonts.ready;

        const img = await loadImage(images[lang]);

        canvas.width = img.naturalWidth;
        canvas.height = img.naturalHeight;

        ctx.clearRect(0, 0, canvas.width, canvas.height);
        ctx.drawImage(img, 0, 0);

        const boxX = canvas.width * s.boxX;
        const boxY = canvas.height * s.boxY;
        const boxW = canvas.width * s.boxW;
        const boxH = canvas.height * s.boxH;

        const centerX = boxX + boxW / 2;
        const centerY = boxY + boxH / 2;
        const maxTextWidth = boxW * 0.82;

        const fontSize = fitFontSize(name, s, maxTextWidth);

        ctx.save();
        ctx.font = `${s.weight} ${fontSize}px ${s.font}`;
        ctx.fillStyle = s.color;
        ctx.textAlign = "center";
        ctx.textBaseline = "middle";
        ctx.direction = lang === "ar" ? "rtl" : "ltr";

        // هذا أهم سطر: ينزل النص شوي عشان يكون بالنص بصريًا داخل البيضاوي
        const visualCenterFix = fontSize * 0.08;

        ctx.fillText(name, centerX, centerY + visualCenterFix, maxTextWidth);
        ctx.restore();

        const safeName = sanitizeFileName(name);
        const link = document.createElement("a");
        link.download = `SupportLines_EidCard_${s.fileLang}_${safeName}.png`;
        link.href = canvas.toDataURL("image/png");
        link.click();

      } catch (error) {
        alert(lang === "ar"
          ? "تعذر تحميل الصورة. تأكدي أن الصور موجودة بنفس مجلد index.html."
          : "Could not load the image. Make sure the images are in the same folder as index.html."
        );
      } finally {
        downloadBtn.disabled = false;
        updateUI();
      }
    }

    langSelect.addEventListener("change", updateUI);
    downloadBtn.addEventListener("click", renderAndDownload);
    nameInput.addEventListener("keydown", e => {
      if (e.key === "Enter") renderAndDownload();
    });

    updateUI();
  </script>
</body>
</html>
